name: Quality and security gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    name: Backend migration and regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.lock.txt
      - name: Install disposable PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql libpq-dev openssl
      - name: Run migration and isolated regression
        run: |
          PG_BIN="$(pg_config --bindir)"
          test -x "$PG_BIN/initdb"
          python backend/scripts/test_isolated.py --pg-bin "$PG_BIN" --openssl "$(command -v openssl)"

  frontend-quality:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: greencity-app/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: greencity-app
        run: npm ci
      - name: Check Markdown links
        working-directory: greencity-app
        run: npm run check:links
      - name: Check runtime source hygiene
        working-directory: greencity-app
        run: npm run check:source
      - name: Run frontend regression
        working-directory: greencity-app
        run: npm test
      - name: Build frontend
        working-directory: greencity-app
        run: npm run build
      - name: Run supplemental UX suites
        working-directory: greencity-app
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/greencity-vite.log" 2>&1 &
          vite_pid=$!
          cleanup() {
            kill "$vite_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/greencity-vite.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/greencity-vite.log"
            exit 1
          fi
          npm run test:ux
          npm run test:assistant
          npm run test:imports
          npm run test:golden-flows
      - name: Check assistant bundle boundary
        working-directory: greencity-app
        run: npm run test:assistant:security

  real-backend-browser:
    name: P1 real-backend Golden Flow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: greencity-app/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement backend/requirements.lock.txt
          npm ci --prefix greencity-app
      - name: Install disposable PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql libpq-dev openssl
      - name: Run disposable real-backend browser rehearsal
        env:
          PHASE3_REAL_BROWSER: '1'
        run: |
          PG_BIN="$(pg_config --bindir)"
          test -x "$PG_BIN/initdb"
          python backend/scripts/phase3_real_backend_browser.py \
            --pg-bin "$PG_BIN" \
            --openssl "$(command -v openssl)" \
            --node "$(command -v node)" \
            --evidence-dir "$RUNNER_TEMP/greencity-real-browser"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --requirement backend/requirements.lock.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: greencity-app/package-lock.json
      - name: Audit locked frontend dependencies
        working-directory: greencity-app
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history for scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
